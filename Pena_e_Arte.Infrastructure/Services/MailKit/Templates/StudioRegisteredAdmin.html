<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>New Studio Registered</title></head>
<body style="font-family:sans-serif;color:#1a1a1a;max-width:560px;margin:0 auto;padding:24px">
  <h2 style="margin-bottom:4px">New studio registered</h2>
  <p style="color:#555;margin-top:0"><strong>{{studio_name}}</strong> has just registered on the platform.</p>
  <table style="width:100%;border-collapse:collapse;margin:16px 0">
    <tr><td style="padding:8px 0;border-bottom:1px solid #e5e5e5;color:#555;width:40%">City</td>
        <td style="padding:8px 0;border-bottom:1px solid #e5e5e5;font-weight:600">{{city}}</td></tr>
    <tr><td style="padding:8px 0;border-bottom:1px solid #e5e5e5;color:#555">Owner email</td>
        <td style="padding:8px 0;border-bottom:1px solid #e5e5e5;font-weight:600">{{owner_email}}</td></tr>
    <tr><td style="padding:8px 0;border-bottom:1px solid #e5e5e5;color:#555">NIPT</td>
        <td style="padding:8px 0;border-bottom:1px solid #e5e5e5;font-weight:600">{{nipt}}</td></tr>
    <tr><td style="padding:8px 0;border-bottom:1px solid #e5e5e5;color:#555">Trial expires</td>
        <td style="padding:8px 0;border-bottom:1px solid #e5e5e5;font-weight:600">{{trial_expires_at}}</td></tr>
    <tr><td style="padding:8px 0;color:#555">Referral code applied</td>
        <td style="padding:8px 0;font-weight:600">{{referral_applied}}</td></tr>
  </table>
  <p><a href="{{studio_detail_url}}" style="color:#7c3aed;font-weight:600">View studio in platform admin →</a></p>
  <hr style="border:none;border-top:1px solid #e5e5e5;margin:24px 0">
  <p style="font-size:11px;color:#aaa;text-align:center">TattooOS Studio Platform</p>
</body>
</html>
