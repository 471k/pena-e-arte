<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Your Artist Has Been Assigned</title></head>
<body style="font-family:sans-serif;color:#1a1a1a;max-width:560px;margin:0 auto;padding:24px">
  <h2 style="margin-bottom:4px">Your artist has been assigned</h2>
  <p style="color:#555;margin-top:0">Hi {{client_first_name}},</p>
  <p><strong>{{studio_name}}</strong> has assigned <strong>{{artist_full_name}}</strong>
     to your upcoming appointment.</p>
  <table style="width:100%;border-collapse:collapse;margin:16px 0">
    <tr><td style="padding:8px 0;border-bottom:1px solid #e5e5e5;color:#555;width:40%">Artist</td>
        <td style="padding:8px 0;border-bottom:1px solid #e5e5e5;font-weight:600">{{artist_full_name}}</td></tr>
    <tr><td style="padding:8px 0;color:#555">Date</td>
        <td style="padding:8px 0;font-weight:600">{{appointment_date}}</td></tr>
  </table>
  <p style="color:#555;font-size:13px">The studio will confirm your appointment soon.</p>
  {{#if show_branding}}
  <hr style="border:none;border-top:1px solid #e5e5e5;margin:24px 0">
  <p style="font-size:11px;color:#aaa;text-align:center">Powered by TattooOS</p>
  {{/if}}
</body>
</html>
