name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC — catches new CVEs in unchanged code

permissions:
  contents: read
  security-events: write
  # actions: read is required by codeql-action/analyze's own internal call to
  # GET .../actions/runs/{run_id} (used for file-coverage/telemetry bookkeeping,
  # unrelated to the security-events upload) — without it that call 403s and
  # fails the whole analyze step even though the CodeQL scan itself succeeded.
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compile for CodeQL (csharp)
        if: matrix.language == 'csharp'
        run: dotnet build "Pena e Arte.slnx" --configuration Release
        # Autobuild is unreliable on multi-project .slnx solutions — build explicitly instead.

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Repo went public 2026-07-26, which makes the Security tab's code-scanning
          # upload available for free (it previously 403'd here — GHAS is required for
          # code scanning on a private repo, and this repo wasn't on a paid plan).
          # Results now upload normally; no upload: never override needed.
