services:
  mysql:
    image: mysql:8.4
    container_name: pena_e_arte_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pena_e_arte_dev
    ports:
      # Host-side port only — override if something else on the host (e.g. a
      # native MySQL install/service) already holds 3306. Container-to-container
      # traffic (api -> mysql:3306) is on the internal Docker network and is
      # unaffected by this either way.
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: pena_e_arte_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Local dev-mode Vault for the ISecretsProvider path — in-memory, auto-unsealed,
  # data lost on restart. This is DELIBERATELY NOT the production posture: there is
  # no K3s cluster to run a real Raft-backed Vault on yet (see
  # docs/payments/implementation-readiness-status-2026-07-31.md §1 and
  # docs/infra/ADR-0002-secrets-management.md). Standing up a production Vault
  # cluster is out of scope here — that's the K3s deploy prompt's job.
  vault:
    image: hashicorp/vault:1.18
    container_name: pena_e_arte_vault
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-only-not-for-prod}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"

  minio:
    image: minio/minio
    container_name: pena_e_arte_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API — matches CloudflareR2.PublicUrl in appsettings.Development.json
      - "9001:9001"   # Web console — http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local observability stack — Prometheus/Loki/Tempo/Grafana, wired to the
  # metrics/traces the API already emits (AddApiOpenTelemetry) and the JSON logs
  # Serilog already writes to Console. Local-only: no K3s manifests, no remote
  # write, no managed Grafana Cloud (see docs/claude/architecture.md Decisions Log).
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: pena_e_arte_prometheus
    restart: unless-stopped
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux needs this; no-op on Docker Desktop
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.4
    container_name: pena_e_arte_loki
    restart: unless-stopped
    volumes:
      - ./docker/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:3.0.2
    container_name: pena_e_arte_tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API (used by Grafana's Tempo datasource)
      - "4317:4317"   # OTLP gRPC — matches OpenTelemetry:OtlpEndpoint
      - "4318:4318"   # OTLP HTTP
    # No healthcheck: grafana/tempo ships a fully distroless image (no shell, no
    # wget/curl — confirmed via `docker exec`, every command failed with
    # "executable file not found in $PATH"). Grafana's own single-binary
    # reference docker-compose.yaml doesn't add one for the same reason.
    # Confirmed reachable manually instead: `curl http://localhost:3200/ready`.

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: pena_e_arte_alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./docker/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"   # Alloy UI — http://localhost:12345/graph, dev-only visibility tool
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.1.1
    container_name: pena_e_arte_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env — do not use admin/admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # Container-parity services — build the exact artifacts that would ship to
  # production. Optional for day-to-day dev (dotnet run / pnpm dev against the
  # infra services above is faster); use `docker compose up --build api frontend`
  # when you need to verify the published image, not just the source tree.
  api:
    build:
      context: .
      dockerfile: Pena_e_Arte.API/Dockerfile
    container_name: pena_e_arte_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: ${DB_CONNECTION_STRING:-Server=mysql;Port=3306;Database=pena_e_arte_dev;User=root;Password=root;AllowPublicKeyRetrieval=true;}
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379,connectTimeout=500,syncTimeout=500,abortConnect=false}
      Jwt__Issuer: ${JWT_ISSUER:-tattoos-dev}
      Jwt__Audience: ${JWT_AUDIENCE:-tattoos-dev}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (min 32 chars)}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__WebhookSecretBilling: ${STRIPE_WEBHOOK_SECRET_BILLING:-}
      Stripe__WebhookSecretConnect: ${STRIPE_WEBHOOK_SECRET_CONNECT:-}
      CloudflareR2__AccountId: ${R2_ACCOUNT_ID:-}
      CloudflareR2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      CloudflareR2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      CloudflareR2__BucketName: ${R2_BUCKET_NAME:-}
      CloudflareR2__PublicUrl: ${R2_PUBLIC_URL:-}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromAddress: ${RESEND_FROM_ADDRESS:-}
      Resend__FromName: ${RESEND_FROM_NAME:-TattooOS}
      # Twilio (SMS via NotificationService) — previously NOT wired here, so any
      # docker-composed deployment ran with permanently empty Twilio credentials.
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__FromNumber: ${TWILIO_FROM_NUMBER:-}
      # Instagram (InstagramService + nightly InstagramSyncJob) — same prior gap.
      Instagram__AppId: ${INSTAGRAM_APP_ID:-}
      Instagram__AppSecret: ${INSTAGRAM_APP_SECRET:-}
      Instagram__RedirectUri: ${INSTAGRAM_REDIRECT_URI:-}
      Instagram__TokenEncryptionKey: ${INSTAGRAM_TOKEN_ENCRYPTION_KEY:-}
      # Secrets backend (Vault). Empty by default; point at the local vault service
      # for container-parity testing of the ISecretsProvider path.
      Vault__Address: ${VAULT_ADDR:-}
      Vault__Token: ${VAULT_TOKEN:-}
      Google__ClientId: ${VITE_GOOGLE_CLIENT_ID:-}
      App__BaseUrl: ${VITE_PUBLIC_URL:-http://localhost:8081}
      Cors__AllowedOrigins__0: ${VITE_PUBLIC_URL:-http://localhost:8081}
      Hangfire__DashboardUsername: ${HANGFIRE_DASHBOARD_USERNAME:?Set HANGFIRE_DASHBOARD_USERNAME in .env — do not default to admin}
      Hangfire__DashboardPassword: ${HANGFIRE_DASHBOARD_PASSWORD:?Set HANGFIRE_DASHBOARD_PASSWORD in .env — do not default to admin}
      ForwardedHeaders__TrustedProxyCidr: ${FORWARDED_HEADERS_TRUSTED_PROXY_CIDR:-}
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-support@tattooos.co}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_APPLE_CLIENT_ID: ${VITE_APPLE_CLIENT_ID:-}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-http://localhost:8081}
    container_name: pena_e_arte_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_HOST: api
      BACKEND_PORT: 8080
    ports:
      - "8081:8080"

volumes:
  mysql_data:
  redis_data:
  minio_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
