<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Source of truth for this copy is src/shared/constants/legalEntity.ts
      (SITE_TAGLINE for title/og:title; SITE_META_DESCRIPTION for the descriptions).
      A static HTML file cannot import a TS constant without a Vite templating plugin this
      repo does not have, so the literal defaults below are duplicated here deliberately. If
      this copy and legalEntity.ts ever diverge, legalEntity.ts wins — update this to match.
      The region between the seo:head markers is REPLACED per route at build time by
      scripts/prerender-meta.ts (metadata from src/shared/seo/siteRoutes.ts); every tag in it
      carries data-doc-meta so useDocumentMeta replaces it instead of duplicating it.
      The default region deliberately has NO canonical and NO og:url: this file is also served for
      every dynamic route (/s/:slug, /artist/:slug, ...), where a canonical of "/" would tell crawlers
      each of those pages is a duplicate of the home page. Per-route files get both from renderHead.
    -->
    <!-- seo:head:start -->
    <title>TattooOS — booking &amp; studio management for tattoo shops</title>
    <meta data-doc-meta="1" name="description" content="TattooOS — booking, deposits, consent forms, and client records for tattoo studios. Ditch the DMs and paper forms." />
    <meta data-doc-meta="1" property="og:type" content="website" />
    <meta data-doc-meta="1" property="og:title" content="TattooOS — booking &amp; studio management for tattoo shops" />
    <meta data-doc-meta="1" property="og:description" content="TattooOS — booking, deposits, consent forms, and client records for tattoo studios. Ditch the DMs and paper forms." />
    <meta data-doc-meta="1" property="og:image" content="https://tattooos.co/og-image.png" />
    <meta data-doc-meta="1" name="twitter:card" content="summary_large_image" />
    <meta data-doc-meta="1" name="twitter:title" content="TattooOS — booking &amp; studio management for tattoo shops" />
    <meta data-doc-meta="1" name="twitter:description" content="TattooOS — booking, deposits, consent forms, and client records for tattoo studios. Ditch the DMs and paper forms." />
    <meta data-doc-meta="1" name="twitter:image" content="https://tattooos.co/og-image.png" />
    <!-- seo:head:end -->

    <!-- Fraunces (Google Fonts) — app-wide font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Identity Services — OAuth popup & One Tap -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Apple Sign In JS SDK -->
    <script
      type="text/javascript"
      src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"
      async
      defer
    ></script>
  </body>
</html>
