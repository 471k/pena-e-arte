<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Source of truth for this copy is src/shared/constants/legalEntity.ts
      (SITE_TAGLINE for title/og:title; SITE_META_DESCRIPTION for the descriptions).
      A static HTML file cannot import a TS constant without a Vite templating plugin this
      repo does not have, so the literal defaults below are duplicated here deliberately. If
      this copy and legalEntity.ts ever diverge, legalEntity.ts wins — update this to match.
    -->
    <title>TattooOS — booking & studio management for tattoo shops</title>
    <meta name="description" content="TattooOS — booking, deposits, consent forms, and client records for tattoo studios. Ditch the DMs and paper forms." />
    <meta property="og:title" content="TattooOS" />
    <meta property="og:description" content="TattooOS — booking, deposits, consent forms, and client records for tattoo studios. Ditch the DMs and paper forms." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Fraunces (Google Fonts) — app-wide font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Identity Services — OAuth popup & One Tap -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Apple Sign In JS SDK -->
    <script
      type="text/javascript"
      src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"
      async
      defer
    ></script>
  </body>
</html>
