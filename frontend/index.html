<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Source of truth for this copy is src/shared/constants/legalEntity.ts (SITE_TAGLINE).
      A static HTML file cannot import a TS constant without a Vite templating plugin this
      repo does not have, so the literal default below is duplicated here deliberately. If
      this copy and legalEntity.ts ever diverge, legalEntity.ts wins — update this to match.
    -->
    <title>TattooOS — booking & studio management for tattoo shops</title>
    <meta name="description" content="TattooOS — booking & studio management for tattoo shops" />
    <meta property="og:title" content="TattooOS" />
    <meta property="og:description" content="TattooOS — booking & studio management for tattoo shops" />
    <meta property="og:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Identity Services — OAuth popup & One Tap -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Apple Sign In JS SDK -->
    <script
      type="text/javascript"
      src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"
      async
      defer
    ></script>
  </body>
</html>
