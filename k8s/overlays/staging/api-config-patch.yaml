# ConfigMap data is a plain map, so this patch merges just these keys into base's
# tattooos-api-config — everything else (Redis__ConnectionString short DNS name,
# Migrations__ApplyOnStartup, OpenTelemetry__OtlpEndpoint pointing at the shared monitoring
# namespace) is correct unchanged, since Kustomize's namespace transformer already resolves
# same-namespace short names correctly inside tattooos-staging too.
#
# Jwt__Issuer/Audience deliberately differ from production's "tattoos-prod" — this is what
# makes the shared JWT_SECRET_KEY judgment call in the staging secrets checklist actually safe:
# a staging-issued token has a different issuer/audience than a production one, so even with
# the same signing key, staging tokens don't validate as production tokens or vice versa.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tattooos-api-config
  namespace: tattooos
data:
  Jwt__Issuer: "tattoos-staging"
  Jwt__Audience: "tattoos-staging"
  App__BaseUrl: "https://staging.tattooos.co"
  Cors__AllowedOrigins__0: "https://staging.tattooos.co"
  # Same paths as production (k8s/overlays/production/api-config-patch.yaml), backed by this
  # overlay's own geoip-pvc.yaml + geoip-cronjob.yaml.
  GeoIp__DatabasePath: "/data/geoip/GeoLite2-City.mmdb"
  GeoIp__AsnDatabasePath: "/data/geoip/GeoLite2-ASN.mmdb"
  # Staging may only text numbers listed in the Sms__AllowedRecipients secret (cd.yml populates it from
  # STAGING_SMS_ALLOWED_RECIPIENTS). Fails closed: with the secret empty or missing, staging sends no SMS
  # at all. Added 2026-10-02 after the staging reminder job texted a load-test number that was never
  # agreed with its owner. Production does not set this, so it is unrestricted.
  Sms__RestrictToAllowList: "true"
  # Staging always talks to POK staging; POK calls the webhook through the staging site, whose nginx
  # forwards /api/ to this API. Card deposits stay off: staging has no Vault (see cd.yml's staging
  # secret step), so no studio can store POK keys here (blockers doc C-1). Turn them on only once it has one.
  Pok__BaseUrl: "https://api-staging.pokpay.io"
  Pok__WebhookCallbackBaseUrl: "https://staging.tattooos.co"
  Payments__CardDepositsEnabled: "false"
