# Production sets GeoIp:* here; staging has its own identical copy in
# k8s/overlays/staging/api-config-patch.yaml (added 2026-09-25). The PVC + CronJob that keep these
# paths populated (geoip-pvc.yaml/geoip-cronjob.yaml/geoip-volume-patch.yaml) exist per overlay.
# With the paths unset, GeoIpService degrades to always-null gracefully rather than erroring —
# see that class's own doc comment and docs/claude/architecture.md's "K8s .mmdb population"
# Decisions Log entry.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tattooos-api-config
  namespace: tattooos
data:
  GeoIp__DatabasePath: "/data/geoip/GeoLite2-City.mmdb"
  GeoIp__AsnDatabasePath: "/data/geoip/GeoLite2-ASN.mmdb"
  # POK card deposits — THE GO-LIVE SWITCH (blockers doc C-2 + C-13), done in two deploys
  # (docs/infra/pok-go-live-runbook.md), each only on Phi's explicit go:
  #   step 1 (2026-10-26): Pok__BaseUrl "https://api.pokpay.io" + Pok__WebhookCallbackBaseUrl
  #                        "https://app.tattooos.co"; card deposits still off
  #   step 2 (2026-10-26): Payments__CardDepositsEnabled "true", together with the "Connect POK" tour step
  # POK keys are per environment: studios connected against POK staging must reconnect with production
  # keys. Never point Pok__BaseUrl back at staging from here on; to stop card deposits in an emergency,
  # set Payments__CardDepositsEnabled back to "false" (runbook "Emergency: turn card deposits off").
  Pok__BaseUrl: "https://api.pokpay.io"
  Pok__WebhookCallbackBaseUrl: "https://app.tattooos.co"
  Payments__CardDepositsEnabled: "true"
  # Saved cards (backlog C-9): off until the tokenisation calls match POK's documented API. Not part of
  # the go-live switch above; turning it on is its own reviewed change, after C-9 is fixed.
  Payments__SavedCardsEnabled: "false"
