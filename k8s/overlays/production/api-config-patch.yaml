# Production sets GeoIp:* here; staging has its own identical copy in
# k8s/overlays/staging/api-config-patch.yaml (added 2026-09-25). The PVC + CronJob that keep these
# paths populated (geoip-pvc.yaml/geoip-cronjob.yaml/geoip-volume-patch.yaml) exist per overlay.
# With the paths unset, GeoIpService degrades to always-null gracefully rather than erroring —
# see that class's own doc comment and docs/claude/architecture.md's "K8s .mmdb population"
# Decisions Log entry.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tattooos-api-config
  namespace: tattooos
data:
  GeoIp__DatabasePath: "/data/geoip/GeoLite2-City.mmdb"
  GeoIp__AsnDatabasePath: "/data/geoip/GeoLite2-ASN.mmdb"
  # POK card deposits — THE GO-LIVE SWITCH (blockers doc C-2 + C-13). These three values are what
  # production runs today, written out so going live is a reviewed change to these lines only:
  #   Pok__BaseUrl                    "https://api.pokpay.io"
  #   Pok__WebhookCallbackBaseUrl     "https://app.tattooos.co"
  #   Payments__CardDepositsEnabled   "true"
  # Change them only on Phi's explicit go and in two deploys (docs/infra/pok-go-live-runbook.md): first
  # the host and webhook, then card deposits on together with the "Connect POK" tour step. POK keys are
  # per environment: studios connected against POK staging must reconnect with production keys. Once
  # card deposits have been on, never point Pok__BaseUrl back at staging; turn card deposits off instead.
  Pok__BaseUrl: "https://api-staging.pokpay.io"
  Pok__WebhookCallbackBaseUrl: ""
  Payments__CardDepositsEnabled: "false"
  # Saved cards (backlog C-9): fixed and checked on POK staging (2026-10-25); on once POK confirmed production
  # keys may tokenise cards. Only takes effect while card deposits are on (PokPaymentProvider ANDs the two).
  Payments__SavedCardsEnabled: "true"
