apiVersion: apps/v1
kind: Deployment
metadata:
  name: pena-e-arte-prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pena-e-arte-prometheus
  template:
    metadata:
      labels:
        app: pena-e-arte-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.1
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: pena-e-arte-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: pena-e-arte-prometheus-data
