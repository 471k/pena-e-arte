apiVersion: v1
kind: ConfigMap
metadata:
  name: pena-e-arte-prometheus-config
  namespace: monitoring
data:
  # Translated from docker/observability/prometheus.yml, with one required edit: the compose
  # config's dual "-container"/"-host" targets (for the containerized-vs-dotnet-run dev
  # topologies) collapse to a single target here — there is no "host" topology in production.
  # Intentional simplification, not an oversight.
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "pena-e-arte-api"
        metrics_path: /metrics
        static_configs:
          - targets: ["pena-e-arte-api.pena-e-arte.svc.cluster.local:8080"]
            labels:
              service: "pena-e-arte-api"
