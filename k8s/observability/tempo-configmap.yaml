apiVersion: v1
kind: ConfigMap
metadata:
  name: pena-e-arte-tempo-config
  namespace: monitoring
data:
  # 1:1 translation of docker/observability/tempo.yaml — no changes needed.
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

    usage_report:
      reporting_enabled: false
