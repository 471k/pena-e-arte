apiVersion: v1
kind: ConfigMap
metadata:
  name: pena-e-arte-grafana-alerting
  namespace: monitoring
data:
  # Grafana's file-based Alerting provisioning format (apiVersion: 1) — same provisioning
  # mechanism grafana-configmap.yaml already uses for dashboards/datasources, extended with a
  # third mounted file rather than a new mechanism. Three rules, all evaluated every 1m:
  #
  # 1. api-pod-not-ready: reuses the exact `up{service="pena-e-arte-api", environment=...}`
  #    series api-overview.json's "Scrape target up" panel already renders (no new metric).
  #    5m `for` avoids paging on a normal rolling-deploy pod replacement — kubelet's default
  #    readiness/liveness periods plus rollout time land well under 2 minutes end to end, so 5
  #    continuous minutes of a target being unreachable is a real outage, not deploy noise.
  #
  # 2. api-5xx-error-rate: the exact percent formula from api-overview.json's "Error rate (5xx
  #    as % of total)" panel. Threshold 5% sustained for 5m: comfortably above the background
  #    noise of a handful of isolated 4xx-adjacent or single retried requests at low traffic,
  #    but low enough to catch a real regression before it compounds — this is a first cut,
  #    tune once real production traffic volume gives a baseline to tune against.
  #
  # 3. hangfire-job-failure-rate: Loki, not Prometheus — now that Alloy actually ships logs
  #    (see docs/claude/architecture.md's Alloy fix entry, 2026-09-04), this queries the
  #    structured "HangfireJobFailed" line HangfireJobFailureLogFilter emits (added alongside
  #    this alert — no such generic failure log line existed before, only two jobs' own
  #    internal LogWarning calls, which don't cover every job). Threshold 3+ in 15 minutes:
  #    Hangfire already auto-retries a job before giving up, so a single Failed transition can
  #    be a transient blip; 3 distinct failures in 15 minutes means retries themselves are
  #    exhausting, which is the actual signal worth waking someone for.
  alerting.yaml: |
    apiVersion: 1

    groups:
      - orgId: 1
        name: pena-e-arte-alerts
        folder: Pena e Arte
        interval: 1m
        rules:
          # These two use the modern reduce->threshold expression pipeline (A: raw instant
          # query, B: reduce A to a scalar via Grafana's "__expr__" expression engine, C:
          # threshold B), not a single-stage "classic condition" query. Found the hard way
          # (2026-09-05, first real deploy of this ConfigMap): a single-stage model with
          # conditions/evaluator/reducer embedded directly against the prometheus-uid
          # datasource evaluates to "invalid format of evaluation results ... looks like time
          # series data, only reduced data can be alerted on" in this Grafana version — it
          # only works when the query source is itself already a Loki count aggregation
          # (see hangfire-job-failure-rate below, which uses that simpler single-stage form
          # successfully). Confirmed via the real Grafana API after deploy, not assumed from
          # provisioning YAML alone.
          - uid: api-pod-not-ready
            title: API pod not ready
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus-uid
                model:
                  refId: A
                  expr: up{service="pena-e-arte-api", environment="production"}
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
            for: 5m
            noDataState: Alerting
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: "pena-e-arte-api is not reachable by Prometheus for 5+ minutes"

          - uid: api-5xx-error-rate
            title: API 5xx error rate spike
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus-uid
                model:
                  refId: A
                  expr: >-
                    100 * sum(rate(http_server_request_duration_seconds_count{service="pena-e-arte-api",
                    environment="production", http_response_status_code=~"5.."}[5m])) /
                    clamp_min(sum(rate(http_server_request_duration_seconds_count{service="pena-e-arte-api",
                    environment="production"}[5m])), 1e-9)
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [5]
            for: 5m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: "pena-e-arte-api 5xx rate has exceeded 5% for 5+ minutes"

          - uid: hangfire-job-failure-rate
            title: Hangfire job failure rate
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: loki-uid
                model:
                  refId: A
                  expr: >-
                    count_over_time({namespace="pena-e-arte"} |= "HangfireJobFailed" [15m])
                  intervalMs: 1000
                  maxDataPoints: 43200
                  conditions:
                    - evaluator:
                        type: gte
                        params: [3]
                      operator:
                        type: and
                      query:
                        params: ["A"]
                      reducer:
                        type: last
                      type: query
            for: 1m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: warning
            annotations:
              summary: "3+ Hangfire jobs failed in the last 15 minutes"

    # Grafana's built-in "email" contact-point type only ever speaks SMTP — it needs the
    # server-level [smtp]/GF_SMTP_* config grafana-deployment.yaml now sets (sourced from
    # pena-e-arte-grafana-smtp, populated by cd.yml via the same RESEND_API_KEY used for the
    # app's own transactional email). Recipient is phisoftwaresolutions@gmail.com — the same
    # confirmed-real, monitored address cluster-issuer.yaml uses today; no dedicated ops/on-
    # call inbox was confirmed to exist yet (see docs/infra/alerting-runbook.md), so this
    # reuses the one already known-good rather than inventing a new destination.
    contactPoints:
      - orgId: 1
        name: ops-email
        receivers:
          - uid: ops-email-receiver
            type: email
            settings:
              addresses: phisoftwaresolutions@gmail.com
              singleEmail: true

    policies:
      - orgId: 1
        receiver: ops-email
        group_by: ["alertname"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
