apiVersion: v1
kind: ConfigMap
metadata:
  name: tattooos-grafana-alerting
  namespace: monitoring
data:
  # Grafana's file-based Alerting provisioning format (apiVersion: 1) — same provisioning
  # mechanism grafana-configmap.yaml already uses for dashboards/datasources, extended with a
  # third mounted file rather than a new mechanism. Six rules, all evaluated every 1m (the
  # fourth to sixth are described next to them below):
  #
  # 1. api-pod-not-ready: reuses the exact `up{service="tattooos-api", environment=...}`
  #    series api-overview.json's "Scrape target up" panel already renders (no new metric).
  #    5m `for` avoids paging on a normal rolling-deploy pod replacement — kubelet's default
  #    readiness/liveness periods plus rollout time land well under 2 minutes end to end, so 5
  #    continuous minutes of a target being unreachable is a real outage, not deploy noise.
  #
  # 2. api-5xx-error-rate: the exact percent formula from api-overview.json's "Error rate (5xx
  #    as % of total)" panel. Threshold 5% sustained for 5m: comfortably above the background
  #    noise of a handful of isolated 4xx-adjacent or single retried requests at low traffic,
  #    but low enough to catch a real regression before it compounds — this is a first cut,
  #    tune once real production traffic volume gives a baseline to tune against.
  #
  # 3. hangfire-job-failure-rate: Loki, not Prometheus — now that Alloy actually ships logs
  #    (see docs/claude/architecture.md's Alloy fix entry, 2026-09-04), this queries the
  #    structured "HangfireJobFailed" line HangfireJobFailureLogFilter emits (added alongside
  #    this alert — no such generic failure log line existed before, only two jobs' own
  #    internal LogWarning calls, which don't cover every job). Threshold 1+ in 15 minutes:
  #    HangfireJobFailureLogFilter is an IApplyStateFilter, so it only ever sees the state a
  #    job FINALLY lands in — AutomaticRetry reschedules a failing job (Scheduled) up to 10
  #    times first, and the line is emitted only once those retries are exhausted. One line
  #    therefore already means "this job is dead", not "transient blip". The threshold was 3
  #    until 2026-10-03, which could never fire for a single broken daily/monthly job:
  #    industry-report's monthly run failed on 2026-10-01 (R2 rejected the SDK's upload
  #    format) and nothing alerted, because only one line was ever logged for it.
  alerting.yaml: |
    apiVersion: 1

    groups:
      - orgId: 1
        name: tattooos-alerts
        folder: TattooOS
        interval: 1m
        rules:
          # These two use the modern reduce->threshold expression pipeline (A: raw instant
          # query, B: reduce A to a scalar via Grafana's "__expr__" expression engine, C:
          # threshold B), not a single-stage "classic condition" query. Found the hard way
          # (2026-09-05, first real deploy of this ConfigMap): a single-stage model with
          # conditions/evaluator/reducer embedded directly against the prometheus-uid
          # datasource evaluates to "invalid format of evaluation results ... looks like time
          # series data, only reduced data can be alerted on" in this Grafana version. The
          # Loki rules below were left on that single-stage form because it seemed to work;
          # it didn't (see the note above hangfire-job-failure-rate), so all four rules now use
          # this pipeline. Confirmed via the real Grafana API after deploy, not assumed from
          # provisioning YAML alone.
          - uid: api-pod-not-ready
            title: API pod not ready
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus-uid
                model:
                  refId: A
                  expr: up{service="tattooos-api", environment="production"}
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
            for: 5m
            noDataState: Alerting
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: "tattooos-api is not reachable by Prometheus for 5+ minutes"

          - uid: api-5xx-error-rate
            title: API 5xx error rate spike
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus-uid
                model:
                  refId: A
                  expr: >-
                    100 * sum(rate(http_server_request_duration_seconds_count{service="tattooos-api",
                    environment="production", http_response_status_code=~"5.."}[5m])) /
                    clamp_min(sum(rate(http_server_request_duration_seconds_count{service="tattooos-api",
                    environment="production"}[5m])), 1e-9)
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [5]
            for: 5m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: "tattooos-api 5xx rate has exceeded 5% for 5+ minutes"

          # The two Loki rules below use the same A -> B (reduce) -> C (threshold) pipeline, with
          # A wrapped in sum() and run as an instant query. They used a single-stage "classic
          # condition" until 2026-10-16, which only looked like it worked: count_over_time
          # returns one series per log stream (one per API pod), so with matching lines the
          # rule evaluated to Error ("looks like time series data" / "duplicate results with
          # labels {}") and fired only because execErrState is Alerting. Found by the real C-8
          # test (production Vault sealed after a node reboot): every alert email carried
          # "grafana_state_reason: Error". With no matching lines Loki returns nothing, which is
          # NoData -> OK, so the rule resolves on its own once the 15-minute window is clean.
          - uid: hangfire-job-failure-rate
            title: Hangfire job failure rate
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: loki-uid
                model:
                  refId: A
                  expr: >-
                    sum(count_over_time({namespace="tattooos"} |= "HangfireJobFailed" [15m]))
                  queryType: instant
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
            for: 1m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: warning
            annotations:
              summary: "A Hangfire job exhausted its retries and failed in the last 15 minutes (query Loki for HangfireJobFailed to see which)"

          # Same summed Loki pipeline as hangfire-job-failure-rate above. Go-live blocker C-8:
          # production Vault is single-node and manually unsealed (ADR-0002), so after any
          # restart it stays sealed until someone unseals it, and every POK card payment returns
          # 503 meanwhile. VaultHealthCheckJob logs "VaultHealthCheckFailed" every 5 minutes
          # while Vault is sealed/unreachable; PokAuthClient and ConnectPokAccountCommand log
          # "Secrets store unavailable" when a real request hits it. Either line alerts.
          - uid: vault-unavailable
            title: Vault sealed or unreachable
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: loki-uid
                model:
                  refId: A
                  expr: >-
                    sum(count_over_time({namespace="tattooos"} |~ "VaultHealthCheckFailed|Secrets store unavailable" [15m]))
                  queryType: instant
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
            for: 1m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: "Vault is sealed or unreachable: POK card payments return 503 until it is unsealed (docs/infra/vault-self-hosted-runbook.md, 'After every Vault pod restart')"

          # Same summed Loki pipeline, but over BOTH environments and summed per environment, so
          # each one fires (and resolves) on its own and the email names it. Added 2026-10-29: an
          # orphaned prepared XA transaction held locks on staging's hangfire_Set from 15 to 29
          # Oct and nothing alerted. Its only trace in the logs was the queries it blocked:
          # MySqlConnector's own "Command Timeout expired" (the command timeout ends the wait
          # before MySQL's 50 s innodb_lock_wait_timeout does), 18-54 a day on staging, zero on
          # both environments before 15 Oct and since the rollback. "Lock wait timeout exceeded"
          # is the same symptom when MySQL's timeout wins. A 3 h window, because the blocked
          # queries came ~1-2 an hour: a 15 m window would fire and resolve over and over.
          - uid: db-query-timeouts
            title: Database queries timing out
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 10800
                  to: 0
                datasourceUid: loki-uid
                model:
                  refId: A
                  expr: >-
                    sum by (environment) (count_over_time({namespace=~"tattooos|tattooos-staging", container=~"api|migrate"}
                    |~ "Lock wait timeout exceeded|Command Timeout expired" [3h]))
                  queryType: instant
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 10800
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                relativeTimeRange:
                  from: 10800
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
            for: 1m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.environment }}: database queries timed out in the last 3 hours, most likely a lock (docs/infra/alerting-runbook.md, 'Database queries timing out')"

          # A deploy's migration Job (container "migrate") logs "Application startup failed" at
          # Fatal level when it can't migrate or seed; CD then stops before the API rollout, so
          # the environment silently stays on the old version. On staging that is what the
          # 15-29 Oct lock looked like from 26 Oct on (22 Fatal lines, no alert). The API
          # container also logs Fatal lines at shutdown (Redis UNSUBSCRIBE timeouts during
          # rollouts, until 28 Oct), which is why this rule looks at migrate only.
          - uid: migration-failed
            title: Deploy failed at the database migration
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: loki-uid
                model:
                  refId: A
                  expr: >-
                    sum by (environment) (count_over_time({namespace=~"tattooos|tattooos-staging", container="migrate"}
                    |= `"@l":"Fatal"` [1h]))
                  queryType: instant
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
            for: 0m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.environment }}: the database migration Job failed, so the last deploy stopped before the API (docs/infra/alerting-runbook.md, 'Deploy failed at the database migration')"

    # Grafana's built-in "email" contact-point type only ever speaks SMTP — it needs the
    # server-level [smtp]/GF_SMTP_* config grafana-deployment.yaml now sets (sourced from
    # tattooos-grafana-smtp, populated by cd.yml via the same RESEND_API_KEY used for the
    # app's own transactional email). Recipient is ops@tattooos.co — a dedicated ops Google
    # Group (Workspace), confirmed live 2026-10-01. Previously reused the personal Gmail
    # cluster-issuer.yaml's ACME contact also used, per this file's own prior note that no
    # dedicated ops/on-call inbox existed yet; that's no longer true, see
    # docs/infra/alerting-runbook.md.
    contactPoints:
      - orgId: 1
        name: ops-email
        receivers:
          - uid: ops-email-receiver
            type: email
            settings:
              addresses: ops@tattooos.co
              singleEmail: true

    policies:
      - orgId: 1
        receiver: ops-email
        group_by: ["alertname"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
