apiVersion: apps/v1
kind: Deployment
metadata:
  name: tattooos-tempo
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tattooos-tempo
  template:
    metadata:
      labels:
        app: tattooos-tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:3.0.2
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - containerPort: 3200
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/tempo/tempo.yaml
              subPath: tempo.yaml
            - name: data
              mountPath: /var/tempo
          # distroless image, no shell/wget/curl (same reason docker-compose.yml has no
          # HEALTHCHECK for this service) — httpGet against /ready IS possible in K8s though,
          # unlike a shell-based Docker HEALTHCHECK.
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: tattooos-tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tattooos-tempo-data
