apiVersion: v1
kind: ConfigMap
metadata:
  name: pena-e-arte-loki-config
  namespace: monitoring
data:
  # 1:1 translation of docker/observability/loki-config.yml — no changes needed.
  loki-config.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 48h # out-of-the-box default carried over, not tuned for production — see architecture.md
