apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Temporary personal address, confirmed by Phi 2026-09-03 — swap for a dedicated ops
    # inbox (e.g. ops@tattooos.co) once one exists. See docs/infra/secrets-rotation-runbook.md
    # for context; changing this later does not require reissuing existing certs.
    email: phisoftwaresolutions@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-dns01-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
