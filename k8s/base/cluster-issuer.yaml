apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # FLAGGED, NOT GUESSED: Phi's real contact email for Let's Encrypt expiry/revocation
    # notices — confirm and replace before this manifest is ever applied to the cluster.
    email: CHANGE-ME@tattooos.co
    privateKeySecretRef:
      name: letsencrypt-prod-dns01-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
