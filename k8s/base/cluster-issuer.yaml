apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Dedicated ops inbox (Google Group, Workspace), confirmed live 2026-10-01 — replaces the
    # temporary personal address this field held since 2026-09-03. See
    # docs/infra/secrets-rotation-runbook.md for context; changing this does not require
    # reissuing existing certs.
    email: ops@tattooos.co
    privateKeySecretRef:
      name: letsencrypt-prod-dns01-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
