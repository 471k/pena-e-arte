apiVersion: batch/v1
kind: Job
metadata:
  name: tattooos-migrate
  namespace: tattooos
spec:
  backoffLimit: 2
  template:
    spec:
      # AppArmor: Unconfined (24 Nov 2026). On kernel 7.0.0-43 the containerd default profile
      # (cri-containerd.apparmor.d) denies a process signalling its own threads. The .NET runtime suspends a
      # running thread for a GC by sending it SIGRTMIN, and treats a refused send as fatal (PROCAbort), so the
      # process dies with exit 139 - every exit-139 crash since 21 Nov, 16 of 16 matched in the kernel log
      # (claude-shared handoffs/code-tracked-exit139-crashes-2026-11-22.md section 0k). The container still runs
      # as the non-root appuser with no effective capabilities. Revisit when Ubuntu ships a kernel that no longer
      # denies same-process signals, or replace with a Localhost profile that allows them.
      securityContext:
        appArmorProfile:
          type: Unconfined
      restartPolicy: Never
      containers:
        - name: migrate
          # Same image as the API Deployment, tag pinned by CD alongside it. No
          # Migrations__ApplyOnStartup override here — it defaults to true (appsettings.json),
          # so this Job's own boot performs exactly one migration run. CD applies and waits for
          # this Job to complete BEFORE rolling out the API Deployment (which runs with
          # Migrations__ApplyOnStartup=false via the ConfigMap), so N replicas never race the
          # same migration history table.
          image: ghcr.io/471k/tattooos-api:latest
          envFrom:
            - configMapRef:
                name: tattooos-api-config
            - secretRef:
                name: tattooos-api-secrets
          # tattooos-api-config sets Migrations__ApplyOnStartup=false for the API
          # Deployment (§ below) — explicitly override it back to true here so this Job (and
          # only this Job) performs the one controlled migration run. env: entries take
          # precedence over envFrom: entries with the same name.
          env:
            - name: Migrations__ApplyOnStartup
              value: "true"
            # Makes Program.cs return immediately after migrating/seeding/registering
            # recurring jobs, instead of falling through to app.Run() and blocking forever —
            # without this, this Job never exits and `kubectl wait --for=condition=complete`
            # always times out on a clean boot. Never set on the API Deployment itself.
            - name: Migrations__ExitAfterMigrate
              value: "true"
          # This Job had no resources at all until 22 Nov 2026, so it was scheduled with no guarantee and could
          # use the whole node during a rollout. It also meant .NET sized itself from the node: the CPX22 -> CPX32
          # rescale on 21 Nov took it from 2 to 4 processors, so Server GC (the Web SDK default) went from 2 heaps
          # and GC threads to 4. Every exit-139 abort since the rescale has been on a GC or thread-pool thread
          # (claude-shared handoffs/code-tracked-exit139-crashes-2026-11-22.md).
          # limits.cpu 2 is a CFS quota, which .NET reads as Environment.ProcessorCount = 2: the pre-rescale GC
          # topology, chosen here rather than decided by the hosting plan. It is the one variable this change moves.
          # No memory limit yet on purpose: a limit also sets the GC's heap hard limit (75% of it), which would be a
          # second variable in the same experiment. Add one once the crash question reads out.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
