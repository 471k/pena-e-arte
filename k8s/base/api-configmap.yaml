# Non-sensitive config only (Phase 8) — safe to commit, unlike tattooos-api-secrets which
# CD populates at deploy time from GitHub Actions secrets and is never written to k8s/ as YAML
# with real values. GeoIp:* keys are deliberately left unset here in base: production and
# staging each set them via their own overlay's api-config-patch.yaml, backed by that overlay's
# geoip-pvc.yaml + geoip-cronjob.yaml (see docs/claude/architecture.md's "K8s .mmdb population"
# Decisions Log entry). GeoIpService degrades to always-null gracefully when they are unset.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tattooos-api-config
  namespace: tattooos
data:
  Jwt__Issuer: "tattoos-prod"
  Jwt__Audience: "tattoos-prod"
  App__BaseUrl: "https://app.tattooos.co"
  Cors__AllowedOrigins__0: "https://app.tattooos.co"
  Migrations__ApplyOnStartup: "false"
  Redis__ConnectionString: "tattooos-redis:6379,connectTimeout=500,syncTimeout=500,abortConnect=false"
  Resend__FromName: "TattooOS"
  OpenTelemetry__OtlpEndpoint: "http://tattooos-tempo.monitoring.svc.cluster.local:4317"
  # Real-client-IP chain: Cloudflare edge -> Traefik -> frontend nginx -> API adds three
  # X-Forwarded-For entries after the visitor. ExtraTrustedCidrs = Cloudflare edge ranges (keep in
  # sync with k8s/cluster/traefik-helmchartconfig.yaml), ForwardLimit = hops to strip.
  ForwardedHeaders__ForwardLimit: "3"
  ForwardedHeaders__ExtraTrustedCidrs: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
