apiVersion: apps/v1
kind: Deployment
metadata:
  name: pena-e-arte-frontend
  namespace: pena-e-arte
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pena-e-arte-frontend
  template:
    metadata:
      labels:
        app: pena-e-arte-frontend
    spec:
      containers:
        - name: frontend
          # Tag pinned by CD (kustomize edit set image) to the built github.sha.
          image: ghcr.io/471k/pena-e-arte-frontend:latest
          ports:
            - containerPort: 8080
          env:
            # nginx-unprivileged's envsubst-on-templates entrypoint resolves these into
            # nginx.conf.template at container start — same mechanism docker-compose.yml uses.
            - name: BACKEND_HOST
              value: pena-e-arte-api
            - name: BACKEND_PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
