apiVersion: apps/v1
kind: Deployment
metadata:
  name: tattooos-frontend
  namespace: tattooos
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tattooos-frontend
  template:
    metadata:
      labels:
        app: tattooos-frontend
    spec:
      containers:
        - name: frontend
          # Tag pinned by CD (kustomize edit set image) to the built github.sha.
          image: ghcr.io/471k/tattooos-frontend:latest
          # A manual `workflow_dispatch` redeploy with no new commit reuses the exact same
          # `staging-<sha>` tag string. Without `Always`, a node that already pulled that tag
          # once (e.g. an earlier failed run) never repulls it even after
          # build-and-push-frontend-staging genuinely rebuilds+repushes under the same tag —
          # confirmed concretely 2026-09-04: a rebuild with the correct
          # VITE_STRIPE_PUBLISHABLE_KEY baked in was silently ignored until this was patched
          # live and the pod restarted.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # nginx-unprivileged's envsubst-on-templates entrypoint resolves these into
            # nginx.conf.template at container start — same mechanism docker-compose.yml uses.
            - name: BACKEND_HOST
              value: tattooos-api
            - name: BACKEND_PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
