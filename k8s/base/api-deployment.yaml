apiVersion: apps/v1
kind: Deployment
metadata:
  name: tattooos-api
  namespace: tattooos
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tattooos-api
  template:
    metadata:
      labels:
        app: tattooos-api
    spec:
      # The preStop pause (10 s) plus .NET's own graceful shutdown must fit inside this.
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          # Keep serving for 10 s after Kubernetes starts removing the pod from the Service, so
          # the frontend's nginx and kube-proxy stop sending it requests before Kestrel stops
          # listening. Without it each rollout dropped a request (28 Oct 2026, 22:09:10Z: nginx
          # "connect() failed (111: Connection refused)" -> 502, plus a 15 s client timeout).
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          # Tag pinned by CD (kustomize edit set image) to the built github.sha — the
          # base manifest's own tag is a placeholder never applied directly.
          image: ghcr.io/471k/tattooos-api:latest
          # A manual `workflow_dispatch` redeploy with no new commit reuses the exact same
          # tag string. Without `Always`, a node that already pulled that tag once (e.g. an
          # earlier failed run) never repulls it even after a real rebuild+repush under the
          # same tag — the node silently keeps serving stale content. Confirmed concretely
          # for the frontend's staging build 2026-09-04; applied here too for the same
          # tag-reuse exposure, not just where it was first observed.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tattooos-api-config
            - secretRef:
                name: tattooos-api-secrets
          # The liveness probe only starts once this passes, so a slow start isn't killed half-way:
          # on 28 Oct 2026 a new pod was still running its startup seeders ~32 s in, failed liveness
          # three times (15 s delay + 3 x 10 s) and was restarted (exit 143). Allows up to 2 minutes.
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          # 15s matches the Dockerfile's own HEALTHCHECK --start-period=15s.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          # timeoutSeconds 3 (Kubernetes' default is 1): a fresh pod's first readiness check opens its
          # database and Redis connections and logged one "context deadline exceeded" 503 per pod start.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # 1000m (was 500m, 28 Oct 2026): at 500m the pod was CFS-throttled (168 throttled periods
              # in its first ~25 min) while the node sat at ~9% CPU, stalling Redis replies past their
              # timeout. Staging went 250m -> 750m for the same reason (staging resources-patch.yaml).
              cpu: 1000m
              memory: 512Mi
